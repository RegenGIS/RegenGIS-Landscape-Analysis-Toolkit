version: 1
scenario_id: height_contours_smallsite
algorithm_id: regengis_toolbox:height_contours
description: Generate contour lines from a small DTM fixture.
status: template
requires:
  qgis_runtime: true
inputs:
  digital_terrain_model_dtm:
    kind: raster
    path: ${FIXTURE_ROOT}/dtm/smallsite_rdnew_dtm.tif
    crs: EPSG:28992
parameters:
  desired_height_distance_between_contours_m: 1.0
outputs:
  Height_contours:
    path: ${OUTPUT_ROOT}/height_contours/height_contours.shp
execution:
  mode: qgis_process
contract: ../contracts/height_contours.contract.yaml
