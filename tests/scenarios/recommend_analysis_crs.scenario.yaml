version: 1
scenario_id: recommend_analysis_crs_rdnew
algorithm_id: regengis_toolbox:recommend_analysis_crs
description: Recommend a suitable analysis CRS for a small Dutch raster fixture.
status: template
requires:
  qgis_runtime: true
inputs:
  INPUT:
    kind: raster
    path: ${FIXTURE_ROOT}/dtm/smallsite_rdnew_dtm.tif
    crs: EPSG:28992
execution:
  mode: qgis_process
contract: ../contracts/recommend_analysis_crs.contract.yaml
result_capture:
  format: json
  path: ${OUTPUT_ROOT}/recommend_analysis_crs/result.json
