version: 1
contract_id: prepare_raster_for_analysis
algorithm_id: regengis_toolbox:prepare_raster_for_analysis
display_name: Prepare Raster for Analysis
group: Data Preparation
kind: raster_with_metadata
crs_rule:
  type: equals_result_key
  result_key: OUTPUT_TARGET_CRS
required_result_keys:
  OUTPUT_SOURCE_CRS:
    type: string
    required: true
    non_empty: true
  OUTPUT_TARGET_CRS:
    type: string
    required: true
    non_empty: true
  OUTPUT_WAS_REPROJECTED:
    type: boolean
    required: true
  OUTPUT_STRATEGY:
    type: string
    required: true
    non_empty: true
  OUTPUT_DESCRIPTION:
    type: string
    required: true
    non_empty: true
outputs:
  OUTPUT:
    kind: raster
    required: true
    min_band_count: 1
    readable: true
relationship_checks:
  - id: prepared_raster_reprojection_flag_consistency
    rule: source_target_match_when_not_reprojected
